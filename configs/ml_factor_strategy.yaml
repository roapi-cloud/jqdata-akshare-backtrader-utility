# ML因子选股策略 - 默认配置

data:
  source: "jqdata"
  index: "399905.XSHE"        # 中证500
  start_date: "2015-01-01"
  end_date: "2023-12-31"
  frequency: "monthly"
  list_days: 90

preprocess:
  winsorize_method: "mad"
  winsorize_scale: 5.0
  fill_method: "industry_mean"
  neutralize_by: ["industry", "market_cap"]
  standardize: true

label:
  method: "top_bottom"
  top_pct: 0.3
  bottom_pct: 0.3
  holding_period: 20

model:
  name: "xgboost"
  params:
    max_depth: 5
    learning_rate: 0.05
    n_estimators: 100
    min_child_weight: 1
    subsample: 0.8
    colsample_bytree: 0.8
  train_window: 60
  retrain_frequency: "monthly"

portfolio:
  n_stocks: 5
  weighting: "equal"
  max_turnover: 1.0

backtest:
  initial_capital: 1000000
  commission: 0.0003
  slippage: 0.001
  stamp_tax: 0.001
  benchmark: "399905.XSHE"

factors:
  - "EP"
  - "BP"
  - "SP"
  - "CFP"
  - "ROE"
  - "ROA"
  - "GPM"
  - "NI"
  - "Revenue_Growth"
  - "Profit_Growth"
  - "Financial_Leverage"
  - "Debt_Equity"
  - "Current_Ratio"
  - "RSI"
  - "MACD_DIF"
  - "MACD_DEA"
  - "BIAS"
  - "ATR"
  - "VOL_Ratio"
  - "Turnover"
  - "Momentum"
  - "Skewness"
  - "Volatility"
